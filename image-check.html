<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PLAYHAUS — Image Check</title><style>body{margin:0;padding:35px;font:15px Arial,sans-serif;background:#faf8f2;color:#262442}h1{font-size:32px;letter-spacing:-1px}a{color:#735bb3}#status{font-weight:700;padding:16px;background:#e9e5f7;border-radius:12px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.item{background:#fff;padding:8px;border-radius:12px}.item img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.item p{text-transform:capitalize;text-align:center;font-weight:700}</style></head><body><h1>PLAYHAUS — Product Image Test</h1><p>All 16 images below should load even when you turn off your internet connection. <a href="index.html">Back to store</a></p><div id="status">Checking images…</div><div class="grid"><div class="item"><img src="images/toys/teddy.webp" alt="teddy"/><p>teddy</p></div><div class="item"><img src="images/toys/rainbow.webp" alt="rainbow"/><p>rainbow</p></div><div class="item"><img src="images/toys/robot.webp" alt="robot"/><p>robot</p></div><div class="item"><img src="images/toys/train.webp" alt="train"/><p>train</p></div><div class="item"><img src="images/toys/dino.webp" alt="dino"/><p>dino</p></div><div class="item"><img src="images/toys/rocket.webp" alt="rocket"/><p>rocket</p></div><div class="item"><img src="images/toys/blocks.webp" alt="blocks"/><p>blocks</p></div><div class="item"><img src="images/toys/camera.webp" alt="camera"/><p>camera</p></div><div class="item"><img src="images/toys/plane.webp" alt="plane"/><p>plane</p></div><div class="item"><img src="images/toys/unicorn.webp" alt="unicorn"/><p>unicorn</p></div><div class="item"><img src="images/toys/racer.webp" alt="racer"/><p>racer</p></div><div class="item"><img src="images/toys/xylophone.webp" alt="xylophone"/><p>xylophone</p></div><div class="item"><img src="images/toys/shape.webp" alt="shape"/><p>shape</p></div><div class="item"><img src="images/toys/dollhouse.webp" alt="dollhouse"/><p>dollhouse</p></div><div class="item"><img src="images/toys/ball.webp" alt="ball"/><p>ball</p></div><div class="item"><img src="images/toys/piano.webp" alt="piano"/><p>piano</p></div></div><script>function check(){let images=[...document.images],done=images.filter(i=>i.complete).length,ok=images.filter(i=>i.complete&&i.naturalWidth>0).length;document.getElementById('status').textContent=`${ok} / ${images.length} images loaded (${done} finished)`;} document.querySelectorAll('img').forEach(i=>{i.addEventListener('load',check);i.addEventListener('error',check)});window.addEventListener('load',check);check();</script></body></html>
